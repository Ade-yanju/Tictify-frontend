<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080910" />
    <!--
      Fonts loaded once, here, rather than via @import inside 27
      separate page <style> blocks. A CSS @import is discovered only
      after the stylesheet parses, so those requests started late AND
      raced each other with four different weight sets. preconnect +
      one stylesheet gets the whole family in a single early request.
      display=swap so text paints in the fallback rather than blocking.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap"
    />
    <meta
      name="description"
      content="Tictify — sell out your event, skip the chaos. Tickets with secure QR entry across Nigeria."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Google AdSense site-ownership verification -->
    <meta name="google-adsense-account" content="ca-pub-1453648623540291" />
    <title>Tictify</title>
    <style>
      html, body { background: #080910; }
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 16px;
        color: #f0ede8;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .boot-mark {
        font: 800 30px/1.1 system-ui, sans-serif;
        letter-spacing: -0.04em;
      }
      .boot-mark span { color: #e8c96a; }
      .boot-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255,255,255,.14);
        border-top-color: #e8c96a;
        border-radius: 50%;
        animation: boot-spin .8s linear infinite;
      }
      .boot-copy { margin: 0; color: #8b887e; font-size: 13px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" aria-label="Loading Tictify">
        <div class="boot-mark">Tic<span>tify</span></div>
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-copy">Loading your workspace…</p>
      </div>
    </div>
    <noscript>
      Tictify is a Nigerian event ticketing platform. Please enable
      JavaScript to browse events and buy tickets, or email
      tictify@gmail.com for help.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
